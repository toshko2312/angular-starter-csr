@if (pages() > 1) {
<nav class="pager" [attr.aria-label]="CONSTANTS.ADMIN_PAGINATION | translate">
  <button
    type="button"
    class="icon-btn tiny"
    [disabled]="page() === 1"
    [attr.aria-label]="CONSTANTS.ADMIN_PAGE_PREV | translate"
    (click)="go(page() - 1)"
  >
    <i class="pi pi-chevron-left"></i>
  </button>

  @for (number of numbers(); track number) {
  <button
    type="button"
    class="chip"
    [class.chip--active]="number === page()"
    [attr.aria-current]="number === page() ? 'page' : null"
    (click)="go(number)"
  >
    {{ number }}
  </button>
  }

  <button
    type="button"
    class="icon-btn tiny"
    [disabled]="page() === pages()"
    [attr.aria-label]="CONSTANTS.ADMIN_PAGE_NEXT | translate"
    (click)="go(page() + 1)"
  >
    <i class="pi pi-chevron-right"></i>
  </button>
</nav>
}
