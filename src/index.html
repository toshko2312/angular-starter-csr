    <!-- Runs before the first paint, which is the whole point: the prerendered
         HTML is light, so a reader who chose dark would otherwise get a white
         frame while Angular boots. ThemeService owns the value from then on. -->

      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    </script>
